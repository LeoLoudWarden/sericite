[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sericite"
dynamic = ["version"]
description = "Sericite: a scripting language with cheap, arbitrarily nested VM isolation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "LeoLoudWarden" }]
keywords = ["language", "interpreter", "virtual-machine", "sandbox", "isolation", "scripting-language"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Interpreters",
]
dependencies = []

[project.optional-dependencies]
demo = ["requests", "python-dotenv"]

[project.scripts]
sericite = "sericite.cli:main"

[project.urls]
Homepage = "https://github.com/LeoLoudWarden/sericite"
Repository = "https://github.com/LeoLoudWarden/sericite"
Issues = "https://github.com/LeoLoudWarden/sericite/issues"
Changelog = "https://github.com/LeoLoudWarden/sericite/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/sericite/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sericite"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "docs",
    "examples",
    "demos",
    "benchmarks",
    ".github",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "README.zh-CN.md",
]

[tool.ruff]
target-version = "py312"
# Markdown holds hand-tuned examples and frozen history; keep the formatter off it.
extend-exclude = ["*.md"]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]
