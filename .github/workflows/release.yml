name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify release metadata
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/sericite/__init__.py)"
          fail() { echo "::error::$*"; exit 1; }
          [ -n "$pkg" ] || fail "could not read __version__ from src/sericite/__init__.py"
          [ "$tag" = "$pkg" ] || fail "tag v$tag does not match __version__ $pkg"
          grep -q "^## \[$pkg\]" CHANGELOG.md || fail "CHANGELOG.md has no [$pkg] section"
          minor="${pkg%.*}.x"
          grep -q "| $minor |" SECURITY.md || fail "SECURITY.md has no $minor row"
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
